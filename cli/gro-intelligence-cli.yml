commands:
- name: gro_client
  description: >-
    Single-command CLI. Selects a data series by ontology name (item, metric,
    region, partner_region), then prints the matching time-series points to
    stdout or writes them to a CSV file. Results are chosen at random from
    matching selections and are explicitly documented as non-deterministic —
    the docstring directs anything more complex to the Python package.
  flags:
  - {flag: --item, description: Ontology item name (e.g. soybeans, sesame)}
  - {flag: --metric, description: Ontology metric name (e.g. export, area harvested)}
  - {flag: --region, description: Ontology region name (e.g. brazil, ethiopia)}
  - {flag: --partner_region, description: Counterparty region for trade series}
  - {flag: --file, description: Write the series to this CSV file instead of stdout}
  - {flag: --token, description: API authentication token (defaults to $GROAPI_TOKEN)}
examples:
- gro_client --item=soybeans --region=brazil --partner_region china --metric export
