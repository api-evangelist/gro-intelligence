  detail: >-
    Gro Intelligence ceased operations in spring 2024 and was liquidated (IP acquired
    by Almanac, November 2024); its API host api.gro-intelligence.com, developer
    portal developers.gro-intelligence.com and app host app.gro-intelligence.com all
    return NXDOMAIN, and gro-intelligence.com is now a parked GoDaddy lander that
    answers HTTP 200 with the same 114-byte redirect body for every path including
    /openapi.json and /.well-known/agent-card.json. STEP 0b contract discovery was
    still run in full; the profile is built from the surfaces that survive — the
    company's public GitHub organization, the first-party MIT-licensed groclient
    library, its dated GitHub releases, and the PyPI/conda-forge listings. No
    OpenAPI, GraphQL SDL, MCP server or A2A agent card was ever published by this
    company.
