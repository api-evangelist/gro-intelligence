aid: gro-intelligence
name: Gro Intelligence
description: >-
  Gro Intelligence was a New York- and Nairobi-based agricultural and climate
  data company, founded in 2014 by Sara Menker, that built a global
  food-and-climate intelligence platform on top of satellite imagery, weather
  models, government statistics and trade data. Its product was a normalized
  ontology — metrics, items, regions, frequencies, sources and units — over
  hundreds of trillions of data points, exposed through a read-only REST API and
  an official Python client used by traders, insurers, lenders and CPG
  procurement teams to forecast yield, price and climate risk. The company
  raised an $85M Series B in 2021 and was named to TIME's 100 most influential
  companies, then ran out of money, laid off 60% of staff in March 2024 and
  ceased operations that spring; Almanac (formerly Semios) acquired its IP and
  AI models out of liquidation in November 2024. This profile is a historical
  record: the API host, developer portal and web application no longer resolve,
  and the primary domain is a parked registrar lander.
