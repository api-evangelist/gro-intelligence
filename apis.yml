apis:
- name: Gro Intelligence API (retired)
  description: >-
    Read-only REST API over the Gro ontology and its agricultural, climate and
    trade time series. Every operation was an HTTP GET under /v2/, authenticated
    with a bearer token issued from the Gro web application: ontology lookup and
    search (/v2/metrics, /v2/items, /v2/regions, /v2/frequencies, /v2/sources,
    /v2/units, /v2/entities/list, /v2/search), series discovery
    (/v2/data_series/list, /v2/stream/data_series/list, /v2/available/sources,
    /v2/available/time-frequencies, /v2/top/{entity_type}), unit handling
    (/v2/units/allowed), geography (/v2/geocentres) and the data plane
    (/v2/data, /v2prime/data). The service is RETIRED — api.gro-intelligence.com
    no longer resolves and no credential can be obtained. Recorded here from the
    company's own published client library, not from a live probe.
  humanURL: https://github.com/gro-intelligence/api-client
  baseURL: https://api.gro-intelligence.com/v2
