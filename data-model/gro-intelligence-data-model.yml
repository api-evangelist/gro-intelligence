- {from: data_series, to: source, type: belongs_to, via: source_id}
- {from: data_series, to: data_point, type: has_many, via: composite selection}
- {from: data_point, to: unit, type: belongs_to, via: unit_id}
- {from: region, to: region, type: has_many, via: descendant/ancestor traversal (lookup_belongs, get_descendant_regions)}
