summary: >-
  Gro Intelligence is out of business. The company shut down in spring 2024
  after failing to raise, entered liquidation, and its intellectual property and
  AI models were acquired by Almanac (formerly Semios) in November 2024. The Gro
  API was never sunset with a policy, a Sunset header or a migration path — the
  hosts were simply switched off and the primary domain was parked.
